<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-bottom: 10px; font-size: 26px; }
        p { color: #ddd; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
        .btn {
            display: inline-block;
            padding: 10px 25px;
            background: #ff758c;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { background: #ff7eb3; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello, I am Manikandan</h1>
        <p>Welcome to my very first website hosted on GitHub Pages. I love coding and building cool things on the web!</p>
        <a href="https://github.com/manikandanofficial2009-oss" target="_blank" class="btn">Visit My GitHub</a>
    </div>
</body>
</html>
